<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt reader</title>
<style>
  :root {
    --bg: #ccd6e1;
    --panel: #e8edf3;
    --ink: #18202e;
    --muted: #55627a;
    --line: #aab6c6;
    --paper: #ffffff;
    --accent: #0d6a64;
    --accent-ink: #ffffff;
    --error: #9b2c1b;
    --sans: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a24;
      --panel: #1d2532;
      --ink: #e6ebf3;
      --muted: #94a1b8;
      --line: #3a465a;
      --accent: #3fb6ad;
      --accent-ink: #08201e;
      --error: #f0907c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.9rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .lede { margin: 0 0 2rem; color: var(--muted); max-width: 60ch; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1.75rem; align-items: start; }
  @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border-radius: 10px; padding: 1.25rem; }
  .drop {
    display: block; width: 100%;
    border: 2px dashed var(--line); border-radius: 8px;
    padding: 1.6rem 1rem; text-align: center;
    background: transparent; color: var(--ink); font: inherit; cursor: pointer;
  }
  .drop.over { border-color: var(--accent); }
  .drop small { display: block; color: var(--muted); margin-top: .25rem; }

  .controls { display: flex; flex-wrap: wrap; gap: .75rem; align-items: end; margin-top: 1rem; }
  .controls label { display: flex; flex-direction: column; font-size: .85rem; color: var(--muted); gap: .2rem; }
  select {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: .45rem .6rem;
  }
  @media (prefers-color-scheme: dark) { select { background: var(--bg); } }
  .check { flex-direction: row !important; align-items: center; gap: .4rem !important; padding-bottom: .5rem; }

  button.primary {
    font: inherit; font-weight: 600; border: 0; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink);
    padding: .55rem 1.1rem; cursor: pointer;
  }
  button.primary:disabled { opacity: .45; cursor: not-allowed; }
  button.quiet {
    font: inherit; font-size: .9rem; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: .35rem .8rem; cursor: pointer;
  }
  button.quiet[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  button.quiet:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  #status { min-height: 1.5rem; margin: 1rem 0 0; color: var(--muted); font-size: .95rem; }
  #status.error { color: var(--error); }

  .view-switch { display: flex; gap: .5rem; margin: 1rem 0 .5rem; }
  .stage { position: relative; line-height: 0; border-radius: 6px; overflow: hidden; background: var(--bg); }
  .stage img { width: 100%; height: auto; display: block; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage svg rect { fill: rgba(13,106,100,.12); stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .empty { color: var(--muted); padding: 2rem 0; text-align: center; line-height: 1.5; margin: 0; }

  /* The result is set like a till receipt: that is the one distinctive element. */
  .paper {
    background: var(--paper); color: #1a1a1a;
    border-radius: 3px; padding: 1.5rem 1.4rem 1.25rem;
    font-family: var(--mono); font-size: .92rem;
    box-shadow: 0 1px 0 rgba(0,0,0,.08), 0 8px 18px rgba(20,30,50,.18);
    border-top: 6px solid #1a1a1a;
  }
  .paper h2 { margin: 0 0 1rem; font-size: 1rem; font-weight: 700; text-align: center; }
  .row { display: flex; align-items: baseline; gap: .5rem; padding: .2rem 0; }
  .row .k { flex: none; text-transform: none; }
  .row .fill { flex: 1; border-bottom: 2px dotted #9aa3b2; transform: translateY(-3px); min-width: 1rem; }
  .row .v { flex: none; max-width: 60%; text-align: right; overflow-wrap: anywhere; font-weight: 700; }
  .row .v.missing { font-weight: 400; color: #6b7280; }
  .tear { border: 0; border-top: 2px dashed #9aa3b2; margin: 1rem 0; }
  .paper pre {
    margin: 0; white-space: pre; tab-size: 4;
    max-height: 320px; overflow: auto; font: inherit; font-size: .82rem; color: #374151;
  }
  .actions { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
  .paper .quiet { color: #1a1a1a; border-color: #9aa3b2; }
  .paper .quiet:hover:not(:disabled) { background: #f1f3f6; }
  .engine-note { margin: .75rem 0 0; color: var(--muted); font-size: .85rem; font-family: var(--sans); }
</style>
</head>
<body>
<main>
  <h1>Receipt reader</h1>
  <p class="lede">Upload a photo of a receipt. The app cleans the image, reads the text and pulls out the company, date and total.</p>

  <div class="layout">
    <section class="panel" aria-label="Upload">
      <button class="drop" id="drop" type="button">
        Choose a receipt image, or drop one here
        <small>JPG, PNG or WebP, up to 10 MB</small>
      </button>
      <input type="file" id="file" accept="image/*" hidden>

      <div class="controls">
        <label>Reader
          <select id="engine"></select>
        </label>
        <label class="check"><input type="checkbox" id="binarize"> Black and white cleanup</label>
        <button class="primary" id="go" type="button" disabled>Read receipt</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>

      <div class="view-switch" id="views" hidden>
        <button class="quiet" id="viewOriginal" type="button" aria-pressed="false">Original</button>
        <button class="quiet" id="viewCleaned" type="button" aria-pressed="true">Cleaned, with text boxes</button>
      </div>
      <p class="empty" id="emptyPreview">Your receipt will appear here.</p>
      <div class="stage" id="stage" hidden>
        <img id="preview" alt="Uploaded receipt">
        <svg id="overlay" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </section>

    <section aria-label="Result">
      <div class="paper">
        <h2>EXTRACTED DETAILS</h2>
        <div id="fields"></div>
        <hr class="tear">
        <pre id="text">Nothing read yet.</pre>
        <div class="actions">
          <button class="quiet" id="copy" type="button" disabled>Copy JSON</button>
          <button class="quiet" id="csv" type="button" disabled>Download CSV</button>
        </div>
      </div>
      <p class="engine-note" id="engineNote"></p>
    </section>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const FIELD_LABELS = { company: 'Company', date: 'Date', total: 'Total' };
const ENGINE_LABELS = {
  easyocr: 'EasyOCR (pre-trained)',
  trocr: 'TrOCR (fine-tuned)',
  tesseract: 'Tesseract (baseline)'
};

let file = null, originalUrl = null, cleanedUrl = null, result = null;

// --- engines ---------------------------------------------------------------
fetch('/api/engines').then(r => r.json()).then(d => {
  d.engines.forEach(name => {
    const o = document.createElement('option');
    o.value = name; o.textContent = ENGINE_LABELS[name] || name;
    $('engine').append(o);
  });
}).catch(() => {
  const o = document.createElement('option');
  o.value = 'easyocr'; o.textContent = ENGINE_LABELS.easyocr;
  $('engine').append(o);
});

// --- file selection --------------------------------------------------------
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = () => setFile($('file').files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); setFile(e.dataTransfer.files[0]); };

function setFile(f) {
  if (!f) return;
  if (!f.type.startsWith('image/')) { setStatus('That file is not an image. Choose a JPG, PNG or WebP.', true); return; }
  if (f.size > 10 * 1024 * 1024) { setStatus('That image is larger than 10 MB. Choose a smaller photo.', true); return; }
  file = f;
  cleanedUrl = null; result = null;
  if (originalUrl) URL.revokeObjectURL(originalUrl);
  originalUrl = URL.createObjectURL(f);
  drop.firstChild.textContent = f.name;
  $('go').disabled = false;
  clearResult();
  showView('original');
  $('emptyPreview').hidden = true;
  $('stage').hidden = false;
  $('views').hidden = true;
  setStatus('');
}

// --- preview ---------------------------------------------------------------
function showView(which) {
  const img = $('preview'), svg = $('overlay');
  const cleaned = which === 'cleaned' && cleanedUrl;
  img.src = cleaned ? cleanedUrl : originalUrl;
  svg.hidden = !cleaned;
  $('viewOriginal').setAttribute('aria-pressed', String(!cleaned));
  $('viewCleaned').setAttribute('aria-pressed', String(!!cleaned));
}
$('viewOriginal').onclick = () => showView('original');
$('viewCleaned').onclick = () => showView('cleaned');

function drawBoxes(lines, size) {
  const svg = $('overlay');
  svg.replaceChildren();
  svg.setAttribute('viewBox', `0 0 ${size[0]} ${size[1]}`);
  lines.forEach(l => {
    if (!l.box) return;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('x', l.box[0]); r.setAttribute('y', l.box[1]);
    r.setAttribute('width', l.box[2] - l.box[0]); r.setAttribute('height', l.box[3] - l.box[1]);
    svg.append(r);
  });
}

// --- run -------------------------------------------------------------------
$('go').onclick = async () => {
  $('go').disabled = true;
  setStatus('Reading the receipt. The first read can take up to a minute while models load.');
  const form = new FormData();
  form.append('file', file);
  const params = new URLSearchParams({ engine: $('engine').value, binarize: $('binarize').checked });
  try {
    const res = await fetch('/api/extract?' + params, { method: 'POST', body: form });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail || 'The server could not read this receipt.');
    result = body;
    cleanedUrl = body.processed_image;
    render(body);
    if (cleanedUrl) {
      drawBoxes(body.lines, body.image_size);
      $('views').hidden = false;
      showView('cleaned');
    }
    setStatus('');
  } catch (err) {
    setStatus(err.message, true);
  }
  $('go').disabled = false;
};

// --- results ---------------------------------------------------------------
function clearResult() {
  $('fields').replaceChildren();
  $('text').textContent = 'Nothing read yet.';
  $('copy').disabled = true; $('csv').disabled = true;
  $('engineNote').textContent = '';
}

function render(r) {
  const box = $('fields');
  box.replaceChildren();
  Object.keys(FIELD_LABELS).forEach(key => {
    const value = r.fields[key];
    const row = document.createElement('div'); row.className = 'row';
    const k = document.createElement('span'); k.className = 'k'; k.textContent = FIELD_LABELS[key];
    const f = document.createElement('span'); f.className = 'fill';
    const v = document.createElement('span'); v.className = 'v';
    if (key === 'date') {
      // show the date as printed AND as it will be saved (YYYY-MM-DD); never invent one
      if (value && r.date_iso) { v.textContent = value + ' (' + r.date_iso + ')'; }
      else if (r.date_invalid) { v.textContent = r.date_invalid + ' is not a valid date'; v.classList.add('missing'); }
      else { v.textContent = 'not found'; v.classList.add('missing'); }
    } else if (value) { v.textContent = value; } else { v.textContent = 'not found'; v.classList.add('missing'); }
    row.append(k, f, v); box.append(row);
  });
  $('text').textContent = r.text || 'No text was found in this image. Try a sharper photo.';
  $('copy').disabled = false; $('csv').disabled = false;
  $('engineNote').textContent = 'Read with ' + (ENGINE_LABELS[r.engine] || r.engine) + '. Check the values before you use them.';
}

$('copy').onclick = async () => {
  if (!result) return;
  try {
    await navigator.clipboard.writeText(JSON.stringify(result.fields, null, 2));
    setStatus('Copied JSON.');
  } catch (e) {
    setStatus('Copy is blocked in this browser. Select the text and copy it manually.', true);
  }
};

$('csv').onclick = () => {
  if (!result) return;
  const esc = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const keys = Object.keys(FIELD_LABELS);
  const csv = keys.map(k => esc(FIELD_LABELS[k])).join(',') + '\n' + keys.map(k => esc(result.fields[k])).join(',') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'receipt.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

function setStatus(msg, isError) {
  const s = $('status');
  s.textContent = msg;
  s.classList.toggle('error', !!isError);
}
</script>
</body>
</html>
